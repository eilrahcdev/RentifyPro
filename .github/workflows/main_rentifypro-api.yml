
name: Deploy RentifyPro Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_rentifypro-api.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: rentifypro-api-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Match the environment created by Azure Deployment Center.
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Check production dependency security
        working-directory: backend
        run: npm audit --omit=dev

      - name: Verify chatbot assets
        working-directory: backend
        run: npm run chatbot:assets:check

      - name: Create clean backend deployment ZIP
        run: |
          git archive --format=zip \
            --output=backend-deploy.zip HEAD:backend

          unzip -Z1 backend-deploy.zip | grep -Fxq 'server.js'
          unzip -Z1 backend-deploy.zip | grep -Fxq 'package.json'
          unzip -Z1 backend-deploy.zip | grep -Fxq 'data/chatbot/chatbot_config.json'
          unzip -Z1 backend-deploy.zip | grep -Fxq 'data/chatbot/rentifypro_chatbot_dataset_v6.json'

          if unzip -Z1 backend-deploy.zip | grep -Eq '(^|/)\.env$|(^|/)node_modules/|(^|/)private_uploads/'; then
            echo "Unsafe files found in deployment archive"
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: rentifypro-api
          package: backend-deploy.zip
